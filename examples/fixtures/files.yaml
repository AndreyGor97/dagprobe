# Фикстуры для examples/dags/sales_files.py — файловый/pandas-стаб (§8.7).
#
# Путь матчится по glob (не по conn_id, как в `conns:`):
#   match.path_glob с "/"  → по всему пути ("/data/*.csv", диск D: отбрасывается);
#   match.path_glob без "/" → по имени файла ("*.csv").
#
# csv — сырой текст файла: разделитель содержится в самих байтах, угадывать нечего,
# парсит штатный pandas своими kwargs. encoding обязателен (§8.7): текст→байты иначе
# угадывается, а именно этого спека требует не делать.
# rows — готовый DataFrame вместо текста (для форматов без текстового вида: parquet/xlsx).
# Запись в путь под правило перехватывается в Run Namespace: на диск не попадает.
files:
  - match: {path_glob: "*.csv"}
    csv: |
      order_id,amount
      1,100
      2,5
      3,7
    encoding: utf-8
